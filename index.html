    <script>
      // Neutralize Vite HMR WebSocket reconnection in Cloud Run preview iframe
      (function() {
        const OriginalWebSocket = window.WebSocket;
        if (OriginalWebSocket) {
          window.WebSocket = function(url, protocols) {
            const isViteHMR =
              (typeof protocols === 'string' && protocols.includes('vite-hmr')) ||
              (Array.isArray(protocols) && protocols.includes('vite-hmr')) ||
              (typeof url === 'string' && (url.includes('vite-hmr') || url.includes('@vite/client')));

            if (isViteHMR) {
              const stub = new EventTarget();
              stub.readyState = 1;
              stub.binaryType = 'blob';
              stub.send = function() {};
              stub.close = function() {};
              return stub;
            }
            return new OriginalWebSocket(url, protocols);
          };
          window.WebSocket.prototype = OriginalWebSocket.prototype;
          window.WebSocket.CONNECTING = OriginalWebSocket.CONNECTING;
          window.WebSocket.OPEN = OriginalWebSocket.OPEN;
          window.WebSocket.CLOSING = OriginalWebSocket.CLOSING;
          window.WebSocket.CLOSED = OriginalWebSocket.CLOSED;
        }

        const origError = console.error;
        console.error = function(...args) {
          const msg = args.map(a => (a && a.message) || String(a)).join(' ');
          if (msg.includes('WebSocket')) return;
          origError.apply(console, args);
        };
        const origWarn = console.warn;
        console.warn = function(...args) {
          const msg = args.map(a => (a && a.message) || String(a)).join(' ');
          if (msg.includes('WebSocket')) return;
          origWarn.apply(console, args);
        };
        window.addEventListener('error', function(event) {
          if (event && (event.message || '').includes('WebSocket')) {
            event.stopImmediatePropagation();
            event.preventDefault();
          }
        }, true);
        window.addEventListener('unhandledrejection', function(event) {
          if (event && event.reason && String(event.reason.message || event.reason).includes('WebSocket')) {
            event.stopImmediatePropagation();
            event.preventDefault();
          }
        }, true);
      })();
    </script>
